<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>一時的にページを表示できません｜相続税申告相談センター</title>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
:root{--navy-dark:#14213D;--navy-mid:#24365C;--gold:#B08D57;--gold-soft:#D9C7A5;--text-main:#22304B;--text-sub:#5B6474;--bg:#F5F6F8;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;color:var(--text-main);background:var(--bg);line-height:1.8;display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased;}
header{background:var(--navy-dark);color:#fff;padding:18px 24px;}
.header-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.logo{font-weight:700;font-size:16px;letter-spacing:.04em;text-decoration:none;color:#fff;}
.logo small{display:block;font-size:11px;font-weight:400;opacity:.75;letter-spacing:.06em;}
.tel{font-size:12px;color:rgba(255,255,255,.8);text-align:right;}
.tel b{display:block;font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;font-size:20px;color:#fff;letter-spacing:.04em;}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:64px 24px;}
.card{background:#fff;border:1px solid #E6E3DC;border-top:4px solid var(--gold);border-radius:8px;max-width:640px;width:100%;padding:52px 40px;text-align:center;box-shadow:0 12px 32px rgba(20,33,61,.08);}
.code{font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;font-size:64px;font-weight:700;color:var(--gold);line-height:1;letter-spacing:.06em;margin-bottom:14px;}
h1{font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;font-size:24px;font-weight:700;color:var(--navy-dark);line-height:1.5;margin-bottom:18px;}
p{font-size:14.5px;color:var(--text-sub);margin-bottom:28px;}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
.btn{display:inline-block;padding:13px 28px;border-radius:4px;font-size:14px;font-weight:700;text-decoration:none;transition:opacity .2s;}
.btn:hover{opacity:.85;}
.btn-primary{background:var(--gold);color:var(--navy-dark);}
.btn-outline{border:1px solid var(--navy-mid);color:var(--navy-mid);background:#fff;}
.phone{margin-top:26px;padding-top:22px;border-top:1px solid #E6E3DC;font-size:13px;color:var(--text-sub);}
.phone a{display:block;font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;font-size:24px;font-weight:700;color:var(--navy-dark);text-decoration:none;letter-spacing:.04em;line-height:1.4;}
footer{background:var(--navy-dark);color:rgba(255,255,255,.7);font-size:11.5px;text-align:center;padding:18px 24px;line-height:1.8;}
@media(max-width:560px){header{padding:14px 16px;}.tel{display:none;}main{padding:40px 16px;}.card{padding:38px 22px;}.code{font-size:52px;}h1{font-size:20px;}.actions .btn{width:100%;}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a class="logo" href="/">相続税申告相談センター<small>運営：タックス・プラン税理士法人</small></a>
    <div class="tel">受付（平日9:00〜18:00）<b>06-6354-8220</b></div>
  </div>
</header>
<main>
  <div class="card">
    <div class="code" aria-hidden="true">500</div>
    <h1>一時的にページを表示できません</h1>
    <p>サーバーで問題が発生しました。しばらく時間をおいてから、もう一度お試しください。<br>お急ぎの場合は、お電話でもご相談を承っています。</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">トップページへ戻る</a>
      <a class="btn btn-outline" href="/#contact">無料相談のお申込み</a>
    </div>
    <div class="phone">お電話でのご相談<a href="tel:0663548220">06-6354-8220</a>受付（平日9:00〜18:00）</div>
  </div>
</main>
<footer>© 2026 相続税申告相談センター　All Rights Reserved.<br>運営：タックス・プラン税理士法人</footer>
</body>
</html>
