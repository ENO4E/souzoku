<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 670px; overflow: hidden; position: relative;
    background: linear-gradient(135deg, #0b1222 0%, #0d1730 55%, #0a1020 100%);
    font-family: "IPAPGothic", "IPAGothic", sans-serif;
  }
  svg.net { position: absolute; inset: 0; }
  .brand {
    position: absolute; left: 72px; top: 78px; display: flex; align-items: center; gap: 16px;
    color: #d9bb6a; font-size: 24px; letter-spacing: 0.06em;
  }
  .brand .bar { width: 46px; height: 4px; background: #d9bb6a; }
  .title {
    position: absolute; left: 72px; top: 150px; margin: 0;
    color: #ffffff; font-size: 60px; line-height: 1.3; font-weight: bold; letter-spacing: 0.02em;
    text-shadow: 0 2px 10px rgba(0,0,0,0.35);
  }
  .sub {
    position: absolute; left: 76px; top: 322px; margin: 0;
    color: #e9cf8c; font-size: 33px; line-height: 1.6; letter-spacing: 0.04em;
  }
  .box {
    position: absolute; left: 72px; top: 564px;
    border: 2px solid #d9bb6a; padding: 8px 26px;
    color: #e9cf8c; font-size: 26px; letter-spacing: 0.04em;
    background: rgba(10, 16, 32, 0.6);
  }
  .url {
    position: absolute; left: 72px; top: 628px;
    color: #d9bb6a; font-size: 20px; letter-spacing: 0.12em; font-family: "DejaVu Sans Mono", monospace;
  }
  svg.art { position: absolute; right: 70px; top: 196px; }
</style>
</head>
<body>
  <svg class="net" width="1280" height="670" id="net"></svg>

  <div class="brand"><span class="bar"></span><span>相続税申告相談センター｜大阪・南森町</span></div>
  <p class="title">「大阪 相続税 税理士 費用」<br>で検索している方へ</p>
  <p class="sub">相場は遺産の0.5〜1%<br>安い理由まで、全部書きます</p>
  <div class="box">基本報酬 99,000円〜（税込）</div>
  <div class="url">kakuyasu-souzokuzei.com</div>

  <!-- house, document, family tree (gold line art) -->
  <svg class="art" width="470" height="450" viewBox="0 0 470 450" fill="none" stroke="#c9a85c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- house -->
    <path d="M150 140 L300 20 L450 140" />
    <rect x="178" y="118" width="244" height="190" />
    <rect x="352" y="22" width="16" height="48" />
    <rect x="212" y="162" width="46" height="42" />
    <rect x="342" y="162" width="46" height="42" />
    <rect x="276" y="228" width="48" height="80" />
    <!-- document -->
    <rect x="20" y="130" width="112" height="146" rx="6" />
    <line x1="42" y1="166" x2="110" y2="166" />
    <line x1="42" y1="190" x2="110" y2="190" />
    <line x1="42" y1="214" x2="110" y2="214" />
    <text x="76" y="256" font-size="30" fill="#c9a85c" stroke="none" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">¥</text>
    <!-- family tree -->
    <circle cx="300" cy="350" r="14" />
    <line x1="300" y1="364" x2="300" y2="386" />
    <line x1="228" y1="386" x2="372" y2="386" />
    <line x1="228" y1="386" x2="228" y2="406" />
    <line x1="300" y1="386" x2="300" y2="406" />
    <line x1="372" y1="386" x2="372" y2="406" />
    <circle cx="228" cy="420" r="14" />
    <circle cx="300" cy="420" r="14" />
    <circle cx="372" cy="420" r="14" />
  </svg>

  <script>
    // seeded constellation on the right half (deterministic so the file is reproducible)
    let seed = 20261026;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    const svg = document.getElementById('net');
    const NS = 'http://www.w3.org/2000/svg';
    const pts = [];
    for (let i = 0; i < 70; i++) {
      pts.push({ x: 700 + rnd() * 560, y: 20 + rnd() * 630 });
    }
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
        const d = Math.hypot(dx, dy);
        if (d < 120) {
          const l = document.createElementNS(NS, 'line');
          l.setAttribute('x1', pts[i].x); l.setAttribute('y1', pts[i].y);
          l.setAttribute('x2', pts[j].x); l.setAttribute('y2', pts[j].y);
          l.setAttribute('stroke', '#c9a85c'); l.setAttribute('stroke-width', '0.8');
          l.setAttribute('stroke-opacity', String(0.12 + (1 - d / 120) * 0.25));
          svg.appendChild(l);
        }
      }
    }
    for (const p of pts) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);
      c.setAttribute('r', String(1.5 + rnd() * 2));
      c.setAttribute('fill', '#d9bb6a'); c.setAttribute('fill-opacity', String(0.5 + rnd() * 0.5));
      svg.appendChild(c);
    }
  </script>
</body>
</html>
