<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070a12">
<meta name="color-scheme" content="dark">
<title>一時的にページを表示できません｜相続税申告相談センター</title>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
:root{--bg:#070a12;--line:rgba(190,200,230,.12);--line-strong:rgba(190,200,230,.22);--text:#eef2fa;--text-sub:#aab4c6;--text-mute:#6e7a8f;--accent:#e6c47a;--grad:linear-gradient(100deg,#e6c47a 0%,#f0d9a3 45%,#8fb3ff 100%);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100%;}
body{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;color:var(--text);background:var(--bg);line-height:1.85;letter-spacing:.02em;display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(40% 50% at 72% 42%,rgba(230,196,122,.14),transparent 70%),radial-gradient(35% 45% at 80% 60%,rgba(143,179,255,.16),transparent 70%),radial-gradient(60% 60% at 20% 90%,rgba(167,139,250,.08),transparent 70%);}
header,main,footer{position:relative;z-index:1;}
header{padding:18px 24px;border-bottom:1px solid var(--line);}
.inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.logo{display:flex;flex-direction:column;line-height:1.25;text-decoration:none;color:var(--text);}
.logo small{font-size:10.5px;letter-spacing:.06em;color:var(--text-sub);}
.logo b{font-size:17px;font-weight:700;letter-spacing:.06em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.tel{font-size:10.5px;color:var(--text-mute);text-align:right;line-height:1.3;}
.tel b{display:block;font-family:'Inter Tight','Helvetica Neue',Arial,sans-serif;font-size:19px;font-weight:500;color:var(--text);letter-spacing:.04em;}
main{flex:1;display:grid;place-items:center;padding:64px 24px;text-align:center;}
.code{font-family:'Inter Tight','Helvetica Neue',Arial,sans-serif;font-size:clamp(96px,20vw,200px);font-weight:300;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
h1{margin-top:16px;font-size:clamp(20px,2.6vw,26px);font-weight:500;line-height:1.5;}
p{margin-top:14px;font-size:14.5px;color:var(--text-sub);}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:36px;}
.btn{display:inline-flex;align-items:center;justify-content:center;height:54px;padding:0 30px;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:.06em;text-decoration:none;transition:transform .3s,border-color .3s;}
.btn:hover{transform:translateY(-2px);}
.btn-primary{color:#141a2a;background:var(--grad);}
.btn-ghost{color:var(--text);border:1px solid var(--line-strong);background:rgba(255,255,255,.03);}
.btn-ghost:hover{border-color:rgba(230,196,122,.6);}
.phone{margin-top:34px;font-size:12.5px;color:var(--text-mute);}
.phone a{display:block;font-family:'Inter Tight','Helvetica Neue',Arial,sans-serif;font-size:26px;font-weight:500;color:var(--text);text-decoration:none;letter-spacing:.04em;line-height:1.4;}
footer{border-top:1px solid var(--line);font-size:11.5px;text-align:center;color:var(--text-mute);padding:18px 24px;line-height:1.8;}
@media(max-width:560px){.tel{display:none;}main{padding:40px 16px;}.actions .btn{width:100%;}}
</style>
</head>
<body>
<header>
  <div class="inner">
    <a class="logo" href="/"><small>運営：タックス・プラン税理士法人</small><b>相続税申告相談センター</b></a>
    <div class="tel">受付（平日9:00〜18:00）<b>06-6354-8220</b></div>
  </div>
</header>
<main>
  <div>
    <div class="code" aria-hidden="true">500</div>
    <h1>一時的にページを表示できません</h1>
    <p>サーバーで問題が発生しました。しばらく時間をおいてから、もう一度お試しください。<br>お急ぎの場合は、お電話でもご相談を承っています。</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">トップページへ戻る</a>
      <a class="btn btn-ghost" href="/#contact">無料相談のお申込み</a>
    </div>
    <div class="phone">お電話でのご相談（平日9:00〜18:00）<a href="tel:0663548220">06-6354-8220</a></div>
  </div>
</main>
<footer>© 2026 相続税申告相談センター　All Rights Reserved.<br>運営：タックス・プラン税理士法人</footer>
</body>
</html>
